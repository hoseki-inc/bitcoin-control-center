appId: com.hoseki.controlcenter
productName: Bitcoin Control Center
directories:
  output: release
  buildResources: resources
asar: true
asarUnpack:
  - app/node_modules/better-sqlite3/prebuilds/*.node
# better-sqlite3 13 ships Node-API prebuilds for every packaged platform.
# Rebuilding would try to cross-compile Windows native code on the macOS host.
npmRebuild: false
afterPack: ./after-pack.mjs
files:
  - app/**/*
extraResources:
  - from: tor/${os}
    to: tor
mac:
  binaries:
    - Contents/Resources/tor/tor
    - Contents/Resources/tor/libevent-2.1.7.dylib
  minimumSystemVersion: '13.0.0'
  category: public.app-category.finance
  target:
    - target: dmg
  # build.sh overrides this to false for ad-hoc review signatures.
  # Use hardened runtime when Developer ID signing is configured.
  hardenedRuntime: true
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  # notarize: true  # TODO: Enable when Apple Developer ID is configured
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
# build.sh uses --publish never. GitHub Actions assembles the installers into
# a draft release after verifying their source identity and checksums.
# Automatic updates are not implemented.
