appId: com.hoseki.controlcenter
productName: Bitcoin Control Center
directories:
  output: release
  buildResources: resources
asar: true
asarUnpack:
  - '**/node_modules/@libsql/**/*.node'
# libSQL loads platform-specific Node-API addons; the Windows prebuild is
# installed by build.sh alongside the macOS optional dependency.
npmRebuild: false
afterPack: ./after-pack.mjs
files:
  - app/**/*
extraResources:
  - from: tor/${os}
    to: tor
mac:
  # Apple's icon grid leaves transparent padding around the tile. The icns has
  # no icp4-icp6 slots: macOS draws PNG data there as noise on 1x screens.
  icon: resources/icon-mac.icns
  binaries:
    - Contents/Resources/tor/tor
    - Contents/Resources/tor/libevent-2.1.7.dylib
  minimumSystemVersion: '13.0.0'
  category: public.app-category.finance
  target:
    - target: dmg
  # build.sh overrides this to false for ad-hoc review signatures.
  # Use hardened runtime when Developer ID signing is configured.
  hardenedRuntime: true
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  # notarize: true  # TODO: Enable when Apple Developer ID is configured
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
# build.sh uses --publish never. GitHub Actions assembles the installers into
# a draft release after verifying their source identity and checksums.
# Updates are never installed automatically: the app only shows a notice when a
# newer release is out, and people download and verify it themselves.
