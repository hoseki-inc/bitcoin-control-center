<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control Center PR Preview</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #0f172a; --muted: #5b6474; --faint: #8a93a3;
    --line: #e3e6eb; --accent: #0f172a; --accent-text: #ffffff; --chip: #eef0f3;
    --warn-bg: #fff4e5; --warn: #9a5b00; --ok-bg: #e9f7ef; --ok: #1d7a46; --info-bg: #eef3ff; --info: #2f4fb5;
    --sel: #eef0f3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --panel: #171a21; --text: #e8ebf0; --muted: #a4acb9; --faint: #7b8494;
      --line: #2a2f3a; --accent: #e8ebf0; --accent-text: #0f1115; --chip: #232833;
      --warn-bg: #3a2a12; --warn: #f0b860; --ok-bg: #13301f; --ok: #6fd39a; --info-bg: #1b2440; --info: #9db2ff;
      --sel: #232833;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; }
  header.top { display: flex; align-items: baseline; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header.top h1 { font-size: 16px; margin: 0; }
  header.top span { color: var(--muted); font-size: 13px; }
  .layout { flex: 1; display: grid; grid-template-columns: 300px 1fr; min-height: 0; }
  nav.list { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); padding: 8px; }
  .group { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin: 14px 8px 6px; }
  button.pr { all: unset; display: block; width: 100%; box-sizing: border-box; padding: 9px 10px; border-radius: 8px; cursor: pointer; }
  button.pr:hover { background: var(--sel); }
  button.pr[aria-current="true"] { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent); }
  button.pr:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .pr .row1 { display: flex; gap: 6px; align-items: baseline; }
  .pr .num { color: var(--faint); font-variant-numeric: tabular-nums; }
  .pr .name { font-weight: 600; }
  .pr .sum { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .chip { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
  .chip.warn { background: var(--warn-bg); color: var(--warn); }
  .chip.ok { background: var(--ok-bg); color: var(--ok); }
  .chip.info { background: var(--info-bg); color: var(--info); }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .detail { padding: 14px 18px 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .detail h2 { margin: 0 0 4px; font-size: 18px; }
  .detail h2 a { color: inherit; }
  .detail p { margin: 0 0 6px; color: var(--muted); max-width: 80ch; }
  .detail ul { margin: 4px 0 8px 18px; padding: 0; color: var(--text); max-width: 90ch; }
  .detail .note { color: var(--warn); font-size: 13px; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
  .controls .label { color: var(--faint); font-size: 12px; margin-right: 2px; }
  .controls button, .controls input { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 7px; padding: 4px 10px; }
  .controls button { cursor: pointer; }
  .controls button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .controls input { width: 220px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .controls .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
  .panes { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; min-height: 0; }
  .panes.single { grid-template-columns: 1fr; }
  .pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; }
  .pane .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .pane .bar b { font-weight: 600; }
  .pane .bar a { color: var(--muted); }
  .pane .bar .sha { color: var(--faint); font-weight: 400; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
  .empty-state { margin: 48px auto; max-width: 560px; padding: 0 18px; }
  .empty-state code { background: var(--chip); padding: 2px 6px; border-radius: 4px; }
  .frame { flex: 1; position: relative; overflow: hidden; background: #fff; }
  .frame iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; background: #fff; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } nav.list { max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--line); } .panes { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="top">
  <h1>Control Center PR Preview</h1>
  <span id="meta"></span>
</header>
<div class="layout">
  <nav class="list" id="list" aria-label="Pull requests"></nav>
  <main>
    <section class="detail" id="detail"></section>
    <section class="panes" id="panes"></section>
  </main>
</div>
<script src=".work/targets.js"></script>
<script>
// Every target runs its own Sentinel on its own port, serving that branch's UI over its own copy of
// the same fictional data. Pages are framed at a desktop or phone width and scaled to fit the pane.
// start.sh writes .work/targets.js with each target's port and commit.
const PREVIEW = window.PREVIEW || null;
const LABELS = { main: "main", "main-empty": "main (no accounts)" };

const prs = [
  { group: "What's live today", key: "main", title: "main", summary: "The app as it is on main right now.", type: "Baseline", single: true,
    screens: [["Home", "/home"], ["Accounts", "/accounts"], ["Add Account", "/accounts/add"], ["Portfolio", "/portfolio"], ["Statements", "/statements"], ["Settings", "/settings"]] },

  { group: "Screen redesigns", num: 154, key: "pr154", title: "Accounts refresh", type: "Redesign",
    summary: "Accounts page, Add Account, account details and the wallet verification flows.",
    adds: ["Accounts: holdings summary, cards with status badges and portfolio-share bars, reconnect states", "Add Account: one grid of wallets, exchanges, multisig and manual entry, shown full screen", "Account details for Coinbase, Kraken, Robinhood, Strike, manual and ETF accounts", "Hardware-wallet and multisig verification screens, receipts and success confetti"],
    screens: [["Accounts", "/accounts"], ["Add Account", "/accounts/add"], ["Trezor flow", "/accounts/verify/trezor"], ["COLDCARD flow", "/accounts/verify/coldcard"], ["Multisig create", "/multisig/create"], ["Manual account type", "/accounts/verify/manual-type"]],
    note: "Account detail pages have different IDs on each side: open an account from the Accounts list in each pane." },
  { group: "Screen redesigns", num: 155, key: "pr155", title: "Portfolio refresh", type: "Redesign",
    summary: "Portfolio's account filter, charts and loading states.",
    adds: ["Account filter replaces the sidebar, with compact and detailed modes", "Readable chart axes and tooltips, clearer empty ranges", "The previous chart stays in place while a new selection loads"],
    screens: [["Portfolio", "/portfolio"]] },
  { group: "Screen redesigns", num: 169, key: "pr169", title: "Home & Statements refresh", type: "Redesign",
    summary: "Home summary and 30-day card, statement list, cards, details and status dialog.",
    adds: ["Home: page heading, Total Bitcoin summary linking to Portfolio, 30-day balance card", "Statements: bordered table, statement cards, shared empty state", "Statement status: one dialog with shorter pending copy"],
    screens: [["Home", "/home"], ["Statements", "/statements"], ["Generate statement", "/statements/create"]],
    note: "The sample data has no statements (they need a verified wallet or exchange), so Statements shows its empty state." },

  { group: "Features", num: 49, key: "pr49", title: "Privacy & Bitcoin display", type: "Feature",
    summary: "Hide-values toggle, and BTC / sats / ₿ display preference.",
    adds: ["A header toggle that masks balances, amounts, shares and charts, remembered in the browser", "Settings: show Bitcoin as BTC, sats or ₿, applied across the app"],
    screens: [["Settings", "/settings"], ["Accounts", "/accounts"], ["Portfolio", "/portfolio"], ["Home", "/home"]],
    note: "Try the hide-values toggle in the header, and change the Bitcoin display in Settings." },
  { group: "Features", num: 50, key: "pr50", title: "Bitcoin price history", type: "Feature",
    summary: "A Bitcoin price chart on Home, backed by a new Sentinel endpoint.",
    adds: ["Sentinel endpoint for historical price, cached for five minutes", "Price chart card with date ranges on the current Home"],
    screens: [["Home", "/home"]] },
  { group: "Features", num: 51, key: "pr51", base: "main-empty", title: "Onboarding & launch welcome", type: "Feature",
    summary: "Getting started for new installs, a sample portfolio and a launch welcome.",
    adds: ["Getting started on Home, only when there are no accounts yet", "An interactive sample portfolio", "A launch welcome animation, skippable and reduced-motion aware", "\"First account ready\" message on Accounts"],
    needs: "Needs #50 (built on it)",
    screens: [["Home", "/home"], ["Accounts", "/accounts"], ["Settings", "/settings"]],
    note: "Both sides have no accounts here, because onboarding only appears on a fresh install. This branch also contains #50." },
  { group: "Features", num: 52, key: "pr52", title: "Shared date picker", type: "Feature",
    summary: "One calendar date picker replacing the browser's native date inputs.",
    adds: ["Typed dates, calendar selection, month and year navigation", "Used by statement dates and Portfolio's custom range", "Adds the @daypicker/react dependency"],
    screens: [["Portfolio", "/portfolio"], ["Generate statement", "/statements/create"]],
    note: "On Portfolio, choose the Custom range to open the date picker. Statement dates need a verified wallet or exchange, which the sample data doesn't have." },

  { group: "Fixes & polish", num: 45, key: "pr45", title: "Statement date fix", type: "Bug fix",
    summary: "Clearing a statement date restores the previous date instead of leaving a blank field that still counts.",
    adds: ["A cleared date field restores its previous date on blur", "Preview and Generate stay enabled"],
    screens: [["Generate statement", "/statements/create"]],
    note: "Only visible with a verified wallet or exchange, which the sample data doesn't have. Overlaps with #52's date fields." },
  { group: "Fixes & polish", num: 213, key: "pr213", title: "Heading sizes follow text styles", type: "Polish",
    summary: "Headings render at the size their text style asks for, instead of Chakra's 36px default.",
    adds: ["\"My Holdings\" drops from 36px to 28px, matching Portfolio's title"],
    screens: [["Accounts", "/accounts"], ["Portfolio", "/portfolio"]] },
];

const VIEWPORTS = { desktop: 1440, laptop: 1280, phone: 390 };
const state = { key: "main", path: "/home", view: "desktop" };
try { Object.assign(state, JSON.parse(localStorage.getItem("cc-preview") || "{}")); } catch {}

const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const save = () => { try { localStorage.setItem("cc-preview", JSON.stringify(state)); } catch {} };
const current = () => prs.find((p) => p.key === state.key) || prs[0];

function renderList() {
  let html = "", group = "";
  for (const p of prs) {
    if (p.group !== group) { group = p.group; html += `<div class="group">${esc(group)}</div>`; }
    const chips = [p.type && `<span class="chip">${esc(p.type)}</span>`, p.needs && `<span class="chip">${esc(p.needs)}</span>`].filter(Boolean).join("");
    html += `<button class="pr" data-key="${p.key}" aria-current="${p.key === state.key}">
      <div class="row1">${p.num ? `<span class="num">#${p.num}</span>` : ""}<span class="name">${esc(p.title)}</span></div>
      <div class="sum">${esc(p.summary)}</div>${chips ? `<div class="chips">${chips}</div>` : ""}</button>`;
  }
  $("#list").innerHTML = html;
}

function renderDetail() {
  const p = current();
  const link = p.num ? `<a href="https://github.com/hoseki-inc/bitcoin-control-center/pull/${p.num}" target="_blank" rel="noreferrer">#${p.num} ${esc(p.title)}</a>` : esc(p.title);
  const screens = p.screens.map(([label, path]) => `<button data-path="${path}" aria-pressed="${path === state.path}">${esc(label)}</button>`).join("");
  const views = Object.keys(VIEWPORTS).map((v) => `<button data-view="${v}" aria-pressed="${v === state.view}">${v[0].toUpperCase() + v.slice(1)}</button>`).join("");
  $("#detail").innerHTML = `
    <h2>${link}</h2>
    <p>${esc(p.summary)}</p>
    ${p.adds ? `<ul>${p.adds.map((a) => `<li>${esc(a)}</li>`).join("")}</ul>` : ""}
    ${p.note ? `<div class="note">${esc(p.note)}</div>` : ""}
    <div class="controls">
      <span class="label">Screen</span>${screens}
      <input id="path" value="${esc(state.path)}" aria-label="Path" spellcheck="false">
      <span class="sep"></span><span class="label">Width</span>${views}
    </div>`;
}

function renderPanes() {
  const p = current();
  const side = (key, label) => ({ label, ...PREVIEW.targets[key] });
  const sides = p.single ? [side("main", LABELS.main)] : [side(p.base || "main", LABELS[p.base || "main"]), side(p.key, `#${p.num} ${p.title}`)];
  $("#panes").className = "panes" + (sides.length === 1 ? " single" : "");
  $("#panes").innerHTML = sides.map((s) => {
    const url = `http://localhost:${s.port}${state.path}`;
    return `<div class="pane"><div class="bar"><b>${esc(s.label)} <span class="sha">${esc(s.sha)}</span></b><a href="${url}" target="_blank" rel="noreferrer">localhost:${s.port}${esc(state.path)} ↗</a></div>
      <div class="frame"><iframe src="${url}" title="${esc(s.label)}"></iframe></div></div>`;
  }).join("");
  fit();
}

// Frame each page at the chosen width, scaled down to the pane, so desktop layouts stay desktop.
function fit() {
  const width = VIEWPORTS[state.view];
  for (const frame of document.querySelectorAll(".frame")) {
    const scale = Math.min(1, frame.clientWidth / width);
    const iframe = frame.querySelector("iframe");
    iframe.style.width = `${width}px`;
    iframe.style.height = `${frame.clientHeight / scale}px`;
    iframe.style.transform = `scale(${scale})`;
    iframe.style.left = `${Math.max(0, (frame.clientWidth - width * scale) / 2)}px`;
  }
}

function render() { renderList(); renderDetail(); renderPanes(); save(); if (location.hash.slice(1) !== state.key) history.replaceState(null, "", `#${state.key}`); }

// A link such as index.html#pr155 opens that PR on its first screen.
function applyHash() {
  const key = location.hash.slice(1);
  if (key && key !== state.key && prs.some((p) => p.key === key)) {
    state.key = key;
    const p = current();
    if (!p.screens.some(([, path]) => path === state.path)) state.path = p.screens[0][1];
  }
}
addEventListener("hashchange", () => { applyHash(); render(); });
applyHash();

document.addEventListener("click", (e) => {
  const pr = e.target.closest("button.pr");
  if (pr) { state.key = pr.dataset.key; const p = current(); if (!p.screens.some(([, path]) => path === state.path)) state.path = p.screens[0][1]; render(); return; }
  const screen = e.target.closest("button[data-path]");
  if (screen) { state.path = screen.dataset.path; renderDetail(); renderPanes(); save(); return; }
  const view = e.target.closest("button[data-view]");
  if (view) { state.view = view.dataset.view; renderDetail(); fit(); save(); }
});
document.addEventListener("keydown", (e) => {
  if (e.target.id === "path" && e.key === "Enter") {
    let path = e.target.value.trim(); if (!path.startsWith("/")) path = "/" + path;
    state.path = path; renderDetail(); renderPanes(); save();
  }
});
addEventListener("resize", fit);
if (!PREVIEW) {
  document.querySelector(".layout").innerHTML = `<div class="empty-state"><h2>The previews aren't running</h2>
    <p>From the repository root, run <code>tools/pr-preview/start.sh</code>. It builds main and each PR, starts them with sample data, and reopens this page.</p></div>`;
} else {
  $("#meta").textContent = `main at ${PREVIEW.targets.main.sha} · started ${PREVIEW.generatedAt} · fictional data: 2 manual accounts and 1 ETF account · PRs as last pushed`;
  render();
}
</script>
</body>
</html>
