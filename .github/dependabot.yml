version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
      day: monday
    groups:
      desktop-dependencies:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /start9
    schedule:
      interval: weekly
      day: monday
    groups:
      startos-dependencies:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /start9/runtime
    schedule:
      interval: weekly
      day: monday
    groups:
      startos-runtime-dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    directory: /start9
    schedule:
      interval: weekly
      day: monday
