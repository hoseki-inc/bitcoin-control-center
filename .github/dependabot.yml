version: 2
# Group routine version updates only. Security fixes stay independent, and
# unmatched major updates remain visible as separate migration PRs.
# Keep all Monday runs at 10:17 UTC; CodeQL follows three hours later.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '10:17'
      timezone: Etc/UTC
    groups:
      production-dependencies:
        applies-to: version-updates
        dependency-type: production
        update-types: [minor, patch]
      development-dependencies:
        applies-to: version-updates
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
      day: monday
      time: '10:17'
      timezone: Etc/UTC
    groups:
      desktop-dependencies:
        applies-to: version-updates
        patterns:
          - '*'
        exclude-patterns:
          - electron
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /start9
    schedule:
      interval: weekly
      day: monday
      time: '10:17'
      timezone: Etc/UTC
    groups:
      startos-dependencies:
        applies-to: version-updates
        patterns:
          - '*'
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /start9/runtime
    schedule:
      interval: weekly
      day: monday
      time: '10:17'
      timezone: Etc/UTC
    groups:
      startos-runtime-dependencies:
        applies-to: version-updates
        patterns:
          - '*'
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '10:17'
      timezone: Etc/UTC

  - package-ecosystem: docker
    directory: /start9
    schedule:
      interval: weekly
      day: monday
      time: '10:17'
      timezone: Etc/UTC
