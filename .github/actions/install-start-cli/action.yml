name: Install StartOS CLI
description: Install the pinned, checksum-verified StartOS CLI and nothing else

runs:
  using: composite
  steps:
    - name: Install pinned StartOS CLI
      shell: bash
      run: |
        curl -fsSL \
          https://github.com/Start9Labs/start-technologies/releases/download/start-cli/v2.3.0/start-cli_x86_64-linux \
          -o "$RUNNER_TEMP/start-cli"
        echo "f4bb04c96eb63e74d5c14325a2ad03c7576ede0e4189ed18558b3915c8e4a6c0  $RUNNER_TEMP/start-cli" | sha256sum --check --strict
        sudo install -m 755 "$RUNNER_TEMP/start-cli" /usr/local/bin/start-cli
        start-cli --version
