name: Install StartOS CLI
description: Install the pinned, checksum-verified StartOS CLI and nothing else

runs:
  using: composite
  steps:
    - name: Install pinned StartOS CLI
      shell: bash
      run: |
        curl -fsSL \
          https://github.com/Start9Labs/start-technologies/releases/download/start-cli/v1.1.0/start-cli_x86_64-linux \
          -o "$RUNNER_TEMP/start-cli"
        echo "70eff67b6e9a936acd8aaaf787b783819252ecedaa5c74d462e3b15ed4dd843a  $RUNNER_TEMP/start-cli" | sha256sum --check --strict
        sudo install -m 755 "$RUNNER_TEMP/start-cli" /usr/local/bin/start-cli
        start-cli --version
