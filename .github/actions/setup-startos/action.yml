name: Set up StartOS build environment
description: Install the pinned StartOS CLI and multi-architecture container build tools

runs:
  using: composite
  steps:
    - name: Install StartOS build prerequisites
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          clang \
          libclang-dev \
          qemu-user-static \
          squashfs-tools-ng

    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

    - name: Set up Docker
      uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    # The signing job installs only this action, so the pin lives in one place.
    - name: Install pinned StartOS CLI
      uses: ./.github/actions/install-start-cli
