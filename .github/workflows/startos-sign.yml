name: Sign StartOS package

# Signs a StartOS package that a key-free job already built. This is the only job that can read
# STARTOS_DEV_KEY, so it runs no repository build, dependency, Node.js, or Docker code: it checks out
# only the start-cli installer, verifies the input against the build job's hash, and re-signs it.
on:
  workflow_call:
    inputs:
      environment:
        description: Environment holding STARTOS_DEV_KEY and STARTOS_SIGNER_PUBKEY, or empty to keep the build's temporary key
        type: string
        required: true
      source-sha:
        description: Commit the package was built from
        type: string
        required: true
      expected-version:
        description: StartOS package version the manifest must declare
        type: string
        required: true
      unsigned-artifact:
        description: Artifact holding the package signed with a temporary build key
        type: string
        required: true
      unsigned-sha256:
        description: SHA-256 of that package, from the build job's outputs
        type: string
        required: true
      package-file:
        description: Package file name, kept for the signed package
        type: string
        required: true
      signed-artifact:
        description: Artifact name for the signed package, its release notes, and SHA256SUMS
        type: string
        required: true
      require-release-notes:
        description: Fail when the manifest has no release notes
        type: boolean
        default: false
      retention-days:
        type: number
        default: 7
    outputs:
      sha256:
        description: SHA-256 of the signed package
        value: ${{ jobs.sign.outputs.sha256 }}
      signing-mode:
        description: Which key signed the package
        value: ${{ jobs.sign.outputs.signing_mode }}
      release-notes-sha256:
        description: SHA-256 of RELEASE_NOTES.md in the signed artifact
        value: ${{ jobs.sign.outputs.release_notes_sha256 }}

permissions:
  contents: read

jobs:
  sign:
    name: Sign StartOS package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only main and release/startos-* can use the release-signing environment and read its key.
    environment: ${{ inputs.environment }}
    # Read access only for the sparse checkout below.
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.stage.outputs.sha256 }}
      signing_mode: ${{ steps.sign.outputs.mode }}
      release_notes_sha256: ${{ steps.stage.outputs.release_notes_sha256 }}
    steps:
      # The build job, which runs dependency code, chooses the name, so it must not reach outside the staging folder.
      - name: Reject unsafe package file names
        env:
          PACKAGE_FILE: ${{ inputs.package-file }}
        run: |
          if [[ ! "$PACKAGE_FILE" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.s9pk$ ]]; then
            echo "::error::Unexpected package file name."
            exit 1
          fi

      # Only the installer action is checked out; no other repository code reaches this runner.
      - name: Check out the start-cli installer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
          sparse-checkout: .github/actions/install-start-cli
          sparse-checkout-cone-mode: false

      - name: Verify the checked-out commit
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Install pinned StartOS CLI
        uses: ./.github/actions/install-start-cli

      - name: Download the unsigned package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.unsigned-artifact }}
          path: ${{ runner.temp }}/unsigned

      # Other jobs can replace artifacts but not job outputs, so the package must match the build job's hash.
      - name: Confirm the package is the one the build job produced
        env:
          PACKAGE: ${{ runner.temp }}/unsigned/${{ inputs.package-file }}
          EXPECTED_SHA256: ${{ inputs.unsigned-sha256 }}
        run: echo "${EXPECTED_SHA256}  ${PACKAGE}" | sha256sum --check --strict

      - name: Verify package identity and architectures
        shell: bash
        env:
          PACKAGE: ${{ runner.temp }}/unsigned/${{ inputs.package-file }}
          EXPECTED_VERSION: ${{ inputs.expected-version }}
          EXPECTED_GIT_HASH: ${{ inputs.source-sha }}
          REQUIRE_RELEASE_NOTES: ${{ inputs.require-release-notes }}
        run: |
          MANIFEST="$(start-cli s9pk inspect "$PACKAGE" manifest)"
          RELEASE_NOTES="$(jq -r '.releaseNotes | if type == "object" then (.en_US // first(.[]) // "") else (. // "") end' <<< "$MANIFEST")"

          [[ "$(jq -r '.id' <<< "$MANIFEST")" == "hoseki-sentinel" ]]
          [[ "$(jq -r '.version' <<< "$MANIFEST")" == "$EXPECTED_VERSION" ]]
          [[ "$(jq -r '[.images[].arch // []] | flatten | unique | join(",")' <<< "$MANIFEST")" == "aarch64,x86_64" ]]
          [[ "$(jq -r '.gitHash' <<< "$MANIFEST")" == "$EXPECTED_GIT_HASH" ]]
          if [[ "$REQUIRE_RELEASE_NOTES" == "true" ]]; then
            [[ -n "$RELEASE_NOTES" ]]
          fi

          jq -S . <<< "$MANIFEST" > "$RUNNER_TEMP/unsigned-manifest.json"

      # start-cli 1.1.0 has no sign command. Editing the manifest with the identity expression `.`
      # rewrites the package unchanged and signs its whole Merkle archive with .startos/build.key.pem.
      - name: Sign the package
        id: sign
        shell: bash
        env:
          STARTOS_DEV_KEY: ${{ secrets.STARTOS_DEV_KEY }}
          STARTOS_SIGNER_PUBKEY: ${{ vars.STARTOS_SIGNER_PUBKEY }}
          UNSIGNED: ${{ runner.temp }}/unsigned/${{ inputs.package-file }}
          SIGNED: ${{ runner.temp }}/signed/${{ inputs.package-file }}
        run: |
          mkdir -p "$(dirname "$SIGNED")"
          cp "$UNSIGNED" "$SIGNED"

          if [[ -z "$STARTOS_DEV_KEY" ]]; then
            echo "mode=temporary clean-install key" >> "$GITHUB_OUTPUT"
            echo "::warning::STARTOS_DEV_KEY is not available. This package keeps its temporary build key and is intended for clean-install testing, not signer-continuous upgrades or StartOS registry publication."
            exit 0
          fi

          EXPECTED_PUBKEY="${STARTOS_SIGNER_PUBKEY,,}"
          if [[ ! "$EXPECTED_PUBKEY" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Set STARTOS_SIGNER_PUBKEY to the 64-character hex Ed25519 public key of STARTOS_DEV_KEY."
            exit 1
          fi

          # start-cli finds the key by walking up from the working directory.
          WORKSPACE="$RUNNER_TEMP/startos-signing"
          trap 'rm -rf "$WORKSPACE"' EXIT
          mkdir -m 700 -p "$WORKSPACE/.startos"
          (umask 077 && printf '%s' "$STARTOS_DEV_KEY" > "$WORKSPACE/.startos/build.key.pem")

          KEY_PUBKEY="$(openssl pkey -in "$WORKSPACE/.startos/build.key.pem" -pubout -outform DER | tail -c 32 | od -An -tx1 -v | tr -d ' \n')"
          if [[ "$KEY_PUBKEY" != "$EXPECTED_PUBKEY" ]]; then
            echo "::error::STARTOS_DEV_KEY does not match STARTOS_SIGNER_PUBKEY."
            exit 1
          fi

          (cd "$WORKSPACE" && start-cli s9pk edit "$SIGNED" manifest '.' > /dev/null)
          echo "mode=permanent signing key" >> "$GITHUB_OUTPUT"

      - name: Verify the signed package
        shell: bash
        env:
          SIGNED: ${{ runner.temp }}/signed/${{ inputs.package-file }}
          SIGNING_MODE: ${{ steps.sign.outputs.mode }}
          STARTOS_SIGNER_PUBKEY: ${{ vars.STARTOS_SIGNER_PUBKEY }}
        run: |
          start-cli s9pk inspect "$SIGNED" commitment > /dev/null
          start-cli s9pk inspect "$SIGNED" manifest | jq -S . > "$RUNNER_TEMP/signed-manifest.json"
          if ! cmp -s "$RUNNER_TEMP/unsigned-manifest.json" "$RUNNER_TEMP/signed-manifest.json"; then
            echo "::error::Signing changed the package manifest."
            exit 1
          fi

          if [[ "$SIGNING_MODE" == "permanent signing key" ]]; then
            # The package header is a 3-byte magic and version, then the signer's 32-byte public key.
            SIGNER="$(od -An -tx1 -v -j 3 -N 32 "$SIGNED" | tr -d ' \n')"
            if [[ "$SIGNER" != "${STARTOS_SIGNER_PUBKEY,,}" ]]; then
              echo "::error::The package is not signed by STARTOS_SIGNER_PUBKEY."
              exit 1
            fi
          fi

      - name: Stage the signed package
        id: stage
        shell: bash
        env:
          SIGNED_DIR: ${{ runner.temp }}/signed
          PACKAGE_FILE: ${{ inputs.package-file }}
        run: |
          cd "$SIGNED_DIR"
          jq -r '.releaseNotes | if type == "object" then (.en_US // first(.[]) // "") else (. // "") end' \
            "$RUNNER_TEMP/signed-manifest.json" > RELEASE_NOTES.md
          sha256sum "$PACKAGE_FILE" > SHA256SUMS
          {
            echo "sha256=$(cut -d' ' -f1 SHA256SUMS)"
            echo "release_notes_sha256=$(sha256sum RELEASE_NOTES.md | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the signed package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.signed-artifact }}
          path: |
            ${{ runner.temp }}/signed/${{ inputs.package-file }}
            ${{ runner.temp }}/signed/RELEASE_NOTES.md
            ${{ runner.temp }}/signed/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.retention-days }}

      - name: Add signing summary
        shell: bash
        env:
          SIGNING_MODE: ${{ steps.sign.outputs.mode }}
          SHA256: ${{ steps.stage.outputs.sha256 }}
          PACKAGE_FILE: ${{ inputs.package-file }}
        run: |
          {
            echo "## StartOS signing"
            echo ""
            echo "- Package: \`${PACKAGE_FILE}\`"
            echo "- Signing: ${SIGNING_MODE}"
            echo "- SHA-256: \`${SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"
