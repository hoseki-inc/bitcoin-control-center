name: Release 3 - Create draft release

on:
  workflow_dispatch:

permissions:
  contents: write

# Release jobs and their reusable workflows cannot consume or publish shared caches.
cache-mode: none

concurrency:
  group: startos-draft-release
  cancel-in-progress: false

jobs:
  source:
    name: Select the release commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Require the default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Run this workflow from ${DEFAULT_BRANCH}, not ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Check out the protected release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Record the exact source commit
        id: source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  desktop:
    needs: source
    permissions:
      contents: read
    uses: ./.github/workflows/build-desktop.yml

  release:
    name: Build StartOS and assemble complete draft release
    needs: [source, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the same protected release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify the protected commit before executing repository code
        env:
          RELEASE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "$RELEASE_SHA"

      - name: Set up Node workspace
        uses: ./.github/actions/setup

      - name: Install packaging dependencies
        run: |
          npm ci --prefix desktop --ignore-scripts
          npm ci --prefix start9 --ignore-scripts
          npm ci --prefix start9/runtime --ignore-scripts

      - name: Run repository verification
        run: pnpm run ci

      - name: Read protected release identity
        id: version
        shell: bash
        run: |
          node start9/scripts/version.mjs check
          VERSION="$(node start9/scripts/version.mjs get)"
          TAG="$(node start9/scripts/version.mjs tag)"
          node start9/scripts/version.mjs assert-tag "$TAG"
          SOURCE_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "source_sha=${SOURCE_SHA}"
            echo "short_sha=${SHORT_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Reject release collisions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          REMOTE_TAG="$(git ls-remote --tags origin "refs/tags/${TAG}")"
          if [[ -n "$REMOTE_TAG" ]]; then
            echo "::error::Release tag ${TAG} already exists. Versions and release tags are immutable."
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::A GitHub Release for ${TAG} already exists."
            exit 1
          fi

      - name: Set up StartOS build environment
        uses: ./.github/actions/setup-startos

      - name: Set up release signing key
        id: signing
        shell: bash
        env:
          STARTOS_DEV_KEY: ${{ secrets.STARTOS_DEV_KEY }}
        run: |
          mkdir -p ~/.startos .startos
          if [[ -n "$STARTOS_DEV_KEY" ]]; then
            printf '%s' "$STARTOS_DEV_KEY" > ~/.startos/id.key.pem
            echo "mode=permanent repository secret" >> "$GITHUB_OUTPUT"
          else
            start-cli init-key
            echo "mode=temporary clean-install key" >> "$GITHUB_OUTPUT"
            echo "::warning::STARTOS_DEV_KEY is not configured. This draft release uses a temporary signing key and is intended for clean-install testing, not signer-continuous upgrades or StartOS registry publication."
          fi
          chmod 600 ~/.startos/id.key.pem
          cp ~/.startos/id.key.pem .startos/build.key.pem
          chmod 600 .startos/build.key.pem

      - name: Build universal StartOS release
        run: ./start9/build.sh

      - name: Verify and stage release
        id: package
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_GIT_HASH: ${{ steps.version.outputs.source_sha }}
          TAG: ${{ steps.version.outputs.tag }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          SOURCE_PACKAGE="start9/hoseki-sentinel.s9pk"
          test -f "$SOURCE_PACKAGE"

          MANIFEST="$(start-cli s9pk inspect "$SOURCE_PACKAGE" manifest)"
          PACKAGE_ID="$(jq -r '.id' <<< "$MANIFEST")"
          PACKAGE_VERSION="$(jq -r '.version' <<< "$MANIFEST")"
          PACKAGE_ARCHES="$(jq -r '[.images[].arch // []] | flatten | unique | join(",")' <<< "$MANIFEST")"
          PACKAGE_GIT_HASH="$(jq -r '.gitHash' <<< "$MANIFEST")"
          RELEASE_NOTES="$(jq -r '.releaseNotes | if type == "object" then (.en_US // first(.[]) // "") else (. // "") end' <<< "$MANIFEST")"

          [[ "$PACKAGE_ID" == "hoseki-sentinel" ]]
          [[ "$PACKAGE_VERSION" == "$EXPECTED_VERSION" ]]
          [[ "$PACKAGE_ARCHES" == "aarch64,x86_64" ]]
          [[ "$PACKAGE_GIT_HASH" == "$EXPECTED_GIT_HASH" ]]
          [[ -n "$RELEASE_NOTES" ]]

          mkdir -p artifacts
          OUTPUT_PACKAGE="artifacts/hoseki-sentinel-${TAG}.s9pk"
          cp "$SOURCE_PACKAGE" "$OUTPUT_PACKAGE"
          printf '%s\n' "$RELEASE_NOTES" > artifacts/RELEASE_NOTES.md
          if [[ "$SIGNING_MODE" == "temporary clean-install key" ]]; then
            {
              echo "> [!WARNING]"
              echo "> This package uses a temporary signing key. It is intended for clean installs and testing, not signer-continuous upgrades or StartOS registry publication."
              echo ""
              cat artifacts/RELEASE_NOTES.md
            } > artifacts/GITHUB_RELEASE_NOTES.md
          else
            cp artifacts/RELEASE_NOTES.md artifacts/GITHUB_RELEASE_NOTES.md
          fi
          (
            cd artifacts
            sha256sum "hoseki-sentinel-${TAG}.s9pk" > SHA256SUMS
          )
          echo "package_git_hash=${PACKAGE_GIT_HASH}" >> "$GITHUB_OUTPUT"

      - name: Download verified desktop builds
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: desktop-*
          path: desktop-artifacts

      - name: Verify desktop identities and assemble release assets
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
        run: |
          node .github/scripts/assemble-desktop-release.cjs desktop-artifacts artifacts "$VERSION" "$SOURCE_SHA"
          {
            echo ""
            echo "### Desktop installers"
            echo ""
            echo "Includes macOS Apple Silicon (ARM64) and Windows x64 installers built from the same source commit as StartOS."
            echo ""
            echo "These are review installers: macOS uses an ad-hoc signature without notarization; Windows has no publisher signature. Operating-system installation warnings are expected."
            echo ""
            echo "DESKTOP_BUILDS.json records each installer version, source commit, and checksum. SHA256SUMS covers all three installers and that metadata."
          } >> artifacts/GITHUB_RELEASE_NOTES.md

      - name: Create draft GitHub Release and exact tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
        run: |
          RELEASE_URL="$(gh release create "$TAG" \
            "artifacts/hoseki-sentinel-${TAG}.s9pk" \
            artifacts/*.dmg \
            artifacts/*.exe \
            artifacts/DESKTOP_BUILDS.json \
            artifacts/SHA256SUMS \
            --draft \
            --latest=false \
            --target "$SOURCE_SHA" \
            --title "Bitcoin Control Center ${VERSION}" \
            --notes-file artifacts/GITHUB_RELEASE_NOTES.md)"
          echo "url=${RELEASE_URL}" >> "$GITHUB_OUTPUT"

      - name: Add release summary
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          {
            echo "## Complete draft release created"
            echo ""
            echo "- Version: \`${VERSION}\`"
            echo "- Exact tag: \`${TAG}\`"
            echo "- Source commit: \`${SHORT_SHA}\`"
            echo "- StartOS: universal \`x86_64\` / \`aarch64\` package"
            echo "- StartOS signing: ${SIGNING_MODE}"
            echo "- Desktop: macOS ARM64 DMG and Windows x64 EXE, with native packaged-runtime smoke tests"
            echo "- Desktop signing: macOS ad-hoc (not notarized); Windows without publisher signature"
            echo "- Registry publication: no"
            echo "- Draft release: ${RELEASE_URL}"
            echo ""
            if [[ "$SIGNING_MODE" == "temporary clean-install key" ]]; then
              echo "> This package is for clean installs and testing only. It does not provide signer continuity for upgrades."
              echo ""
            fi
            echo "Review the draft and its checksum before publishing it."
          } >> "$GITHUB_STEP_SUMMARY"
