name: Desktop build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop-runtime:
    name: Desktop build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac
            arch: arm64
          - os: windows-2022
            target: win
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Preserve shell script line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Reusable workflows inherit the caller's exact event commit.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the workflow commit before executing repository code
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      # Installers are built from fresh outputs and never read or write the shared build cache.
      - uses: ./.github/actions/setup
        with:
          cache: 'false'
      - name: Install locked desktop dependencies without lifecycle scripts
        run: npm ci --prefix desktop --ignore-scripts
      - name: Download the pinned Electron binary with checksum verification
        run: npm --prefix desktop run install:electron
      - name: Test native SQLite and PDF rendering in Electron
        run: npm --prefix desktop run test:runtime
      - name: Build, sign (ad hoc on Mac), and stage the installer with its metadata and checksum
        env:
          DESKTOP_TARGET: ${{ matrix.target }}
        run: bash desktop/build.sh "--${DESKTOP_TARGET}"
      - name: Smoke-test the packaged Mac runtime
        if: matrix.target == 'mac'
        run: |
          APP="desktop/release/mac-arm64/Bitcoin Control Center.app"
          codesign --verify --deep --strict "$APP"
          ELECTRON_RUN_AS_NODE=1 "$APP/Contents/MacOS/Bitcoin Control Center" \
            desktop/scripts/smoke.mjs "$APP/Contents/Resources"
      - name: Smoke-test the packaged Windows runtime
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          & 'desktop/release/win-unpacked/Bitcoin Control Center.exe' desktop/scripts/smoke.mjs desktop/release/win-unpacked/resources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Confirm packaging did not edit source files
        run: git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.target }}-${{ matrix.arch }}
          path: desktop/release/artifacts/${{ matrix.target }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
