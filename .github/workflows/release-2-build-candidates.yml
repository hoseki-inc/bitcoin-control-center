name: Release 2 - Build candidates

on:
  workflow_dispatch:

permissions:
  contents: read

# Candidate packages must be built without shared caches, including called workflows.
cache-mode: none

concurrency:
  group: release-2-build-candidates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    uses: ./.github/workflows/desktop-runtime.yml

  build:
    name: Build private StartOS candidate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      sha256: ${{ steps.package.outputs.sha256 }}

    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify the workflow commit before executing repository code
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node workspace
        uses: ./.github/actions/setup
        with:
          cache: 'false'

      - name: Install packaging dependencies
        run: |
          npm ci --prefix desktop --ignore-scripts
          npm ci --prefix start9 --ignore-scripts
          npm ci --prefix start9/runtime --ignore-scripts

      - name: Run repository verification
        run: pnpm run ci

      - name: Confirm clean source revision
        run: git diff --exit-code

      - name: Read protected StartOS version
        id: version
        shell: bash
        run: |
          VERSION="$(node start9/scripts/version.mjs get)"
          TAG="$(node start9/scripts/version.mjs tag)"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          ARTIFACT_NAME="hoseki-sentinel-${TAG}-${SHORT_SHA}"
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "short_sha=${SHORT_SHA}"
            echo "artifact_name=${ARTIFACT_NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up StartOS build environment
        uses: ./.github/actions/setup-startos

      # start-cli needs a key to pack. The signing job replaces this signature on protected branches.
      - name: Create temporary package signing key
        run: |
          start-cli init-key
          mkdir -p .startos
          install -m 600 ~/.startos/id.key.pem .startos/build.key.pem

      - name: Build universal StartOS candidate
        run: ./start9/build.sh

      - name: Stage the candidate for signing
        id: package
        shell: bash
        env:
          ARTIFACT_NAME: ${{ steps.version.outputs.artifact_name }}
        run: |
          mkdir -p artifacts
          cp start9/hoseki-sentinel.s9pk "artifacts/${ARTIFACT_NAME}.s9pk"
          echo "sha256=$(sha256sum "artifacts/${ARTIFACT_NAME}.s9pk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Add build summary
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
        run: |
          {
            echo "## StartOS candidate"
            echo ""
            echo "- Version: \`${VERSION}\`"
            echo "- Release tag form: \`${TAG}\`"
            echo "- Source commit: \`${SHORT_SHA}\`"
            echo "- Architectures: \`x86_64\`, \`aarch64\`"
            echo "- Published: no"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the candidate for signing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: startos-unsigned
          path: artifacts/${{ steps.version.outputs.artifact_name }}.s9pk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # The signing key is an environment secret that only protected branches can read. Other branches,
  # including Dependabot's, run without the environment and keep the temporary build key.
  sign:
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/startos-sign.yml
    with:
      environment: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/startos-')) && 'release-signing' || '' }}
      source-sha: ${{ github.sha }}
      expected-version: ${{ needs.build.outputs.version }}
      unsigned-artifact: startos-unsigned
      unsigned-sha256: ${{ needs.build.outputs.sha256 }}
      package-file: ${{ needs.build.outputs.artifact_name }}.s9pk
      signed-artifact: ${{ needs.build.outputs.artifact_name }}
      retention-days: 14

  # Each architecture builds natively. A matrix job's legs share one set of outputs, so each leg sets
  # only the outputs named for its architecture.
  umbrel-image:
    name: Build Umbrel sideload image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    outputs:
      amd64_sha256: ${{ steps.image.outputs.amd64_sha256 }}
      arm64_sha256: ${{ steps.image.outputs.arm64_sha256 }}
    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify the workflow commit before executing repository code
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node workspace
        uses: ./.github/actions/setup
        with:
          cache: 'false'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build Sentinel and the web app
        run: ./umbrel/build.sh app

      - name: Build the sideload image
        id: image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          # Written outside the checkout: an untracked file would mark the sideload version dirty.
          ./umbrel/build.sh image "$ARCH" sideload "$RUNNER_TEMP/umbrel-image/${ARCH}.tar"
          echo "${ARCH}_sha256=$(sha256sum "$RUNNER_TEMP/umbrel-image/${ARCH}.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Confirm packaging did not edit source files
        run: git diff --exit-code

      - name: Upload the image for the bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: umbrel-sideload-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/umbrel-image/${{ matrix.arch }}.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  umbrel-bundle:
    name: Pack private Umbrel sideload bundle
    needs: umbrel-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify the workflow commit before executing repository code
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      # Packing uses only Node built-ins and shell tools, so no dependencies are installed here.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Download the amd64 image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: umbrel-sideload-image-amd64
          path: ${{ runner.temp }}/umbrel-images

      - name: Download the arm64 image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: umbrel-sideload-image-arm64
          path: ${{ runner.temp }}/umbrel-images

      # Other jobs can replace artifacts but not job outputs, so each image must match its build job's hash.
      - name: Confirm the images are the ones the build jobs produced
        working-directory: ${{ runner.temp }}/umbrel-images
        env:
          AMD64_SHA256: ${{ needs.umbrel-image.outputs.amd64_sha256 }}
          ARM64_SHA256: ${{ needs.umbrel-image.outputs.arm64_sha256 }}
        run: |
          printf '%s  amd64.tar\n%s  arm64.tar\n' "$AMD64_SHA256" "$ARM64_SHA256" | sha256sum --check --strict

      - name: Pack the sideload bundle
        id: bundle
        shell: bash
        run: |
          ./umbrel/build.sh bundle "$RUNNER_TEMP/umbrel-images" "$RUNNER_TEMP/umbrel-bundle"
          cd "$RUNNER_TEMP/umbrel-bundle"
          BUNDLE_FILES=(*.tar.gz)
          if [[ ${#BUNDLE_FILES[@]} -ne 1 || ! -f "${BUNDLE_FILES[0]}" ]]; then
            echo "::error::Expected exactly one sideload bundle."
            exit 1
          fi
          BUNDLE_FILE="${BUNDLE_FILES[0]}"
          mkdir "$RUNNER_TEMP/umbrel-artifact"
          cp "$BUNDLE_FILE" "$RUNNER_TEMP/umbrel-artifact/"
          (cd "$RUNNER_TEMP/umbrel-artifact" && sha256sum "$BUNDLE_FILE" > SHA256SUMS)
          {
            echo "name=${BUNDLE_FILE%.tar.gz}"
            echo "file=${BUNDLE_FILE}"
            echo "sha256=$(sha256sum "$BUNDLE_FILE" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the private sideload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: |
            ${{ runner.temp }}/umbrel-artifact/${{ steps.bundle.outputs.file }}
            ${{ runner.temp }}/umbrel-artifact/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Add bundle summary
        shell: bash
        env:
          BUNDLE_FILE: ${{ steps.bundle.outputs.file }}
          SHA256: ${{ steps.bundle.outputs.sha256 }}
        run: |
          {
            echo "## Umbrel sideload candidate"
            echo ""
            echo "- Version: \`$(node start9/scripts/version.mjs umbrel)\`"
            echo "- Bundle: \`${BUNDLE_FILE}\`"
            echo "- Source commit: \`$(git rev-parse --short=12 HEAD)\`"
            echo "- Architectures: \`amd64\`, \`arm64\`"
            echo "- SHA-256: \`${SHA256}\`"
            echo "- Published: no"
            echo ""
            echo "Install steps: \`umbrel/README.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # Runs Release 3's assembly and checksum verification on these candidates, without creating a release.
  assemble:
    name: Rehearse release assembly
    needs: [desktop, build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the workflow commit before executing repository code
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Download the desktop candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Bitcoin-Control-Center-*
          path: desktop-artifacts
      - name: Download the StartOS candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact-id }}
          path: startos-artifact
      - name: Stage only the verified StartOS candidate and notes
        env:
          PACKAGE_FILE: ${{ needs.build.outputs.artifact_name }}.s9pk
          EXPECTED_SHA256: ${{ needs.sign.outputs.sha256 }}
          EXPECTED_NOTES_SHA256: ${{ needs.sign.outputs.release-notes-sha256 }}
        run: node .github/scripts/stage-startos-release.mjs startos-artifact artifacts "$PACKAGE_FILE" "$EXPECTED_SHA256" "$EXPECTED_NOTES_SHA256"
      - name: Assemble and verify every asset as Release 3 does
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          node .github/scripts/assemble-desktop-release.mjs desktop-artifacts artifacts "$VERSION" "$GITHUB_SHA"
          (cd artifacts && sha256sum -c SHA256SUMS)
