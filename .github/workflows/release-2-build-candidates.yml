name: Release 2 - Build candidates

on:
  workflow_dispatch:

permissions:
  contents: read

# Candidate packages must be built without shared caches, including called workflows.
cache-mode: none

concurrency:
  group: release-2-build-candidates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    uses: ./.github/workflows/desktop-runtime.yml

  build:
    name: Build private StartOS candidate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      sha256: ${{ steps.package.outputs.sha256 }}

    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify the workflow commit before executing repository code
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node workspace
        uses: ./.github/actions/setup
        with:
          cache: 'false'

      - name: Install packaging dependencies
        run: |
          npm ci --prefix desktop --ignore-scripts
          npm ci --prefix start9 --ignore-scripts
          npm ci --prefix start9/runtime --ignore-scripts

      - name: Run repository verification
        run: pnpm run ci

      - name: Confirm clean source revision
        run: git diff --exit-code

      - name: Read protected StartOS version
        id: version
        shell: bash
        run: |
          VERSION="$(node start9/scripts/version.mjs get)"
          TAG="$(node start9/scripts/version.mjs tag)"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          ARTIFACT_NAME="hoseki-sentinel-${TAG}-${SHORT_SHA}"
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "short_sha=${SHORT_SHA}"
            echo "artifact_name=${ARTIFACT_NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up StartOS build environment
        uses: ./.github/actions/setup-startos

      # start-cli needs a key to pack. The signing job replaces this signature on protected branches.
      - name: Create temporary package signing key
        run: |
          start-cli init-key
          mkdir -p .startos
          install -m 600 ~/.startos/id.key.pem .startos/build.key.pem

      - name: Build universal StartOS candidate
        run: ./start9/build.sh

      - name: Stage the candidate for signing
        id: package
        shell: bash
        env:
          ARTIFACT_NAME: ${{ steps.version.outputs.artifact_name }}
        run: |
          mkdir -p artifacts
          cp start9/hoseki-sentinel.s9pk "artifacts/${ARTIFACT_NAME}.s9pk"
          echo "sha256=$(sha256sum "artifacts/${ARTIFACT_NAME}.s9pk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Add build summary
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
        run: |
          {
            echo "## StartOS candidate"
            echo ""
            echo "- Version: \`${VERSION}\`"
            echo "- Release tag form: \`${TAG}\`"
            echo "- Source commit: \`${SHORT_SHA}\`"
            echo "- Architectures: \`x86_64\`, \`aarch64\`"
            echo "- Published: no"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the candidate for signing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: startos-unsigned
          path: artifacts/${{ steps.version.outputs.artifact_name }}.s9pk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # The signing key is an environment secret that only main can read. Other branches, including
  # Dependabot's, run without the environment and keep the temporary build key.
  sign:
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/startos-sign.yml
    with:
      environment: ${{ github.ref == 'refs/heads/main' && 'release-signing' || '' }}
      source-sha: ${{ github.sha }}
      expected-version: ${{ needs.build.outputs.version }}
      unsigned-artifact: startos-unsigned
      unsigned-sha256: ${{ needs.build.outputs.sha256 }}
      package-file: ${{ needs.build.outputs.artifact_name }}.s9pk
      signed-artifact: ${{ needs.build.outputs.artifact_name }}
      retention-days: 14
    secrets:
      STARTOS_DEV_KEY: ${{ secrets.STARTOS_DEV_KEY }}

  # Like StartOS signing, only main gets the Developer ID. Other branches keep the ad-hoc Mac
  # installer, which macOS blocks.
  mac-sign:
    needs: desktop
    permissions:
      contents: read
    uses: ./.github/workflows/mac-sign.yml
    with:
      environment: ${{ github.ref == 'refs/heads/main' && 'release-signing' || '' }}
      source-sha: ${{ github.sha }}
      unsigned-artifact-id: ${{ needs.desktop.outputs.mac-artifact-id }}
      unsigned-sha256: ${{ needs.desktop.outputs.mac-sha256 }}
      signed-artifact: mac-installer-candidate
      retention-days: 14
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}

  # Builds the same bundle as a local ./umbrel/build.sh, with arm64 under QEMU.
  umbrel:
    name: Build unpublished Umbrel sideload bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify the workflow commit before executing repository code
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node workspace
        uses: ./.github/actions/setup
        with:
          cache: 'false'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the sideload bundle
        id: bundle
        shell: bash
        run: |
          ./umbrel/build.sh
          BUNDLE="$(basename umbrel/dist/*.tar.gz .tar.gz)"
          echo "name=${BUNDLE}" >> "$GITHUB_OUTPUT"
          {
            echo "## Umbrel sideload candidate"
            echo ""
            echo "- Bundle: \`${BUNDLE}.tar.gz\`"
            echo "- Architectures: \`amd64\`, \`arm64\`"
            echo "- Published: no"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the unpublished sideload bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: |
            umbrel/dist/${{ steps.bundle.outputs.name }}.tar.gz
            umbrel/dist/${{ steps.bundle.outputs.name }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  # Runs Release 3's assembly and checksum verification on these candidates, without creating a release.
  assemble:
    name: Rehearse release assembly
    needs: [desktop, build, sign, mac-sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the workflow commit before executing repository code
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Download the Windows candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Bitcoin-Control-Center-win-x64
          path: desktop-artifacts/Bitcoin-Control-Center-win-x64
      - name: Download the signed Mac candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.mac-sign.outputs.artifact-id }}
          path: desktop-artifacts/Bitcoin-Control-Center-mac-arm64
      - name: Confirm the Mac candidate is the one the signing job produced
        env:
          EXPECTED_SHA256: ${{ needs.mac-sign.outputs.sha256 }}
        run: |
          FILE="$(jq -r '.file' desktop-artifacts/Bitcoin-Control-Center-mac-arm64/mac.json)"
          echo "${EXPECTED_SHA256}  desktop-artifacts/Bitcoin-Control-Center-mac-arm64/${FILE}" | sha256sum --check --strict
      - name: Download the StartOS candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact-id }}
          path: startos-artifact
      - name: Stage only the verified StartOS candidate and notes
        env:
          PACKAGE_FILE: ${{ needs.build.outputs.artifact_name }}.s9pk
          EXPECTED_SHA256: ${{ needs.sign.outputs.sha256 }}
          EXPECTED_NOTES_SHA256: ${{ needs.sign.outputs.release-notes-sha256 }}
        run: node .github/scripts/stage-startos-release.mjs startos-artifact artifacts "$PACKAGE_FILE" "$EXPECTED_SHA256" "$EXPECTED_NOTES_SHA256"
      - name: Assemble and verify every asset as Release 3 does
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          node .github/scripts/assemble-desktop-release.mjs desktop-artifacts artifacts "$VERSION" "$GITHUB_SHA"
          (cd artifacts && sha256sum -c SHA256SUMS)
