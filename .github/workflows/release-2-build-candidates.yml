name: Release 2 - Build candidates

on:
  workflow_dispatch:

permissions:
  contents: read

# Candidate packages must be built without shared caches, including called workflows.
cache-mode: none

concurrency:
  group: release-2-build-candidates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    uses: ./.github/workflows/desktop-runtime.yml

  build:
    name: Build private StartOS candidate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      sha256: ${{ steps.package.outputs.sha256 }}

    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify the workflow commit before executing repository code
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node workspace
        uses: ./.github/actions/setup
        with:
          cache: 'false'

      - name: Install packaging dependencies
        run: |
          npm ci --prefix desktop --ignore-scripts
          npm ci --prefix start9 --ignore-scripts
          npm ci --prefix start9/runtime --ignore-scripts

      - name: Run repository verification
        run: pnpm run ci

      - name: Confirm clean source revision
        run: git diff --exit-code

      - name: Read protected StartOS version
        id: version
        shell: bash
        run: |
          VERSION="$(node start9/scripts/version.mjs get)"
          TAG="$(node start9/scripts/version.mjs tag)"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          ARTIFACT_NAME="hoseki-sentinel-${TAG}-${SHORT_SHA}"
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "short_sha=${SHORT_SHA}"
            echo "artifact_name=${ARTIFACT_NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up StartOS build environment
        uses: ./.github/actions/setup-startos

      # start-cli needs a key to pack. The signing job replaces this signature on protected branches.
      - name: Create temporary package signing key
        run: |
          start-cli init-key
          mkdir -p .startos
          install -m 600 ~/.startos/id.key.pem .startos/build.key.pem

      - name: Build universal StartOS candidate
        run: ./start9/build.sh

      - name: Stage the candidate for signing
        id: package
        shell: bash
        env:
          ARTIFACT_NAME: ${{ steps.version.outputs.artifact_name }}
        run: |
          mkdir -p artifacts
          cp start9/hoseki-sentinel.s9pk "artifacts/${ARTIFACT_NAME}.s9pk"
          echo "sha256=$(sha256sum "artifacts/${ARTIFACT_NAME}.s9pk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Add build summary
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
        run: |
          {
            echo "## StartOS candidate"
            echo ""
            echo "- Version: \`${VERSION}\`"
            echo "- Release tag form: \`${TAG}\`"
            echo "- Source commit: \`${SHORT_SHA}\`"
            echo "- Architectures: \`x86_64\`, \`aarch64\`"
            echo "- Published: no"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the candidate for signing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: startos-unsigned
          path: artifacts/*.s9pk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # The signing key is an environment secret that only protected branches can read. Other branches,
  # including Dependabot's, run without the environment and keep the temporary build key.
  sign:
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/startos-sign.yml
    with:
      environment: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/startos-')) && 'release-signing' || '' }}
      source-sha: ${{ github.sha }}
      expected-version: ${{ needs.build.outputs.version }}
      unsigned-artifact: startos-unsigned
      unsigned-sha256: ${{ needs.build.outputs.sha256 }}
      package-file: ${{ needs.build.outputs.artifact_name }}.s9pk
      signed-artifact: ${{ needs.build.outputs.artifact_name }}
      retention-days: 14

  # Runs Release 3's assembly and checksum verification on these candidates, without creating a release.
  assemble:
    name: Rehearse release assembly
    needs: [desktop, build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the workflow commit before executing repository code
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Download the desktop candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Bitcoin-Control-Center-*
          path: desktop-artifacts
      - name: Download the StartOS candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: artifacts
      - name: Confirm the StartOS candidate is the one the signing job verified
        env:
          PACKAGE: artifacts/${{ needs.build.outputs.artifact_name }}.s9pk
          EXPECTED_SHA256: ${{ needs.sign.outputs.sha256 }}
        run: echo "${EXPECTED_SHA256}  ${PACKAGE}" | sha256sum --check --strict
      - name: Assemble and verify every asset as Release 3 does
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          node .github/scripts/assemble-desktop-release.mjs desktop-artifacts artifacts "$VERSION" "$GITHUB_SHA"
          (cd artifacts && sha256sum -c SHA256SUMS)
