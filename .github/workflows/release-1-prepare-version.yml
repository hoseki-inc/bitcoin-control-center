name: Release 1 - Prepare version
run-name: Prepare ${{ inputs.bump_type }} release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: What kind of release is this? (x marks the changing number)
        required: true
        type: choice
        options:
          - patch (0.0.x:0)
          - minor (0.x.0:0)
          - major (x.0.0:0)
          - revision (0.0.0:x)

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-1-prepare-version
  cancel-in-progress: false

jobs:
  prepare:
    name: Open version pull request
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Require the default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Run this workflow from ${DEFAULT_BRANCH}, not ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Check out the protected source version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node workspace
        uses: ./.github/actions/setup

      - name: Install StartOS dependencies
        run: npm ci --prefix start9 --ignore-scripts

      - name: Prepare version graph
        id: version
        shell: bash
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
          RELEASE_NOTES: 'STARTOS_RELEASE_NOTES_REQUIRED: Replace this placeholder with reviewed multiline release notes.'
          STARTOS_ALLOW_RELEASE_NOTES_PLACEHOLDER: '1'
        run: |
          OLD_VERSION="$(node start9/scripts/version.mjs get)"
          # Strip the dropdown's display hint before passing the bump name.
          node start9/scripts/version.mjs bump "${BUMP_TYPE%% *}" --notes "$RELEASE_NOTES"
          NEW_VERSION="$(node start9/scripts/version.mjs get)"
          TAG="$(node start9/scripts/version.mjs tag)"
          BRANCH="release/startos-${TAG}"
          VERSION_FILE="start9/startos/versions/${TAG//./_}.ts"
          {
            echo "old_version=${OLD_VERSION}"
            echo "new_version=${NEW_VERSION}"
            echo "tag=${TAG}"
            echo "branch=${BRANCH}"
            echo "version_file=${VERSION_FILE}"
          } >> "$GITHUB_OUTPUT"

      - name: Format and validate version change
        env:
          STARTOS_ALLOW_RELEASE_NOTES_PLACEHOLDER: '1'
        run: |
          pnpm exec oxlint --config .oxlintrc.imports.json --fix start9/startos/versions
          pnpm exec oxfmt --write start9/startos/versions
          npm --prefix start9 run check
          pnpm exec oxlint --config .oxlintrc.imports.json --deny-warnings start9/startos/versions
          pnpm exec oxfmt --check start9/startos/versions
          git diff --check

      - name: Reject version and branch collisions
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          REMOTE_TAG="$(git ls-remote --tags origin "refs/tags/${TAG}")"
          if [[ -n "$REMOTE_TAG" ]]; then
            echo "::error::Release tag ${TAG} already exists. Prepare a newer StartOS version."
            exit 1
          fi

          REMOTE_BRANCH="$(git ls-remote --heads origin "refs/heads/${BRANCH}")"
          if [[ -n "$REMOTE_BRANCH" ]]; then
            echo "::error::Release branch ${BRANCH} already exists. Update or remove its existing pull request before retrying."
            exit 1
          fi

      - name: Commit version branch
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add start9/startos/versions
          if git diff --cached --quiet; then
            echo "::error::The requested release did not create a version change."
            exit 1
          fi
          git commit -m "release(startos): prepare ${TAG}"
          git push origin "HEAD:refs/heads/${BRANCH}"

      - name: Open release pull request
        id: pull_request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BUMP_TYPE: ${{ inputs.bump_type }}
          OLD_VERSION: ${{ steps.version.outputs.old_version }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ steps.version.outputs.branch }}
          VERSION_FILE: ${{ steps.version.outputs.version_file }}
        run: |
          {
            echo "## StartOS release preparation"
            echo ""
            echo "- Bump type: \`${BUMP_TYPE}\`"
            echo "- Version: \`${OLD_VERSION}\` → \`${NEW_VERSION}\`"
            echo "- Exact release tag: \`${TAG}\`"
            echo ""
            echo "## Release notes required"
            echo ""
            echo "This pull request intentionally starts with placeholder release notes, so its CI check will fail until they are replaced."
            echo ""
            echo "1. Open \`${VERSION_FILE}\` in **Files changed** and select **Edit file**."
            echo "2. Replace the \`STARTOS_RELEASE_NOTES_REQUIRED\` placeholder with the final multiline release notes."
            echo "3. Use a blank line before the list and put each bullet on its own line beginning with \`-\`."
            echo "4. Commit the edit to this release branch and wait for all checks to pass."
            echo ""
            echo "Only the \`releaseNotes\` value in the version file is packaged and shown by StartOS. Editing this pull-request description does not change the packaged release notes."
            echo ""
            echo "## Before merging"
            echo ""
            echo "- Confirm the release notes preview correctly in the version-file diff."
            echo "- Let all protected checks pass."
            echo "- Run Release 2 - Build candidates from this branch to test StartOS and both desktop installers."
            echo ""
            echo "The tag is intentionally not created by this pull request. After merging, run Release 3 - Create draft release from main."
          } > "$RUNNER_TEMP/startos-release-pr.md"

          PR_URL="$(gh pr create \
            --base "$DEFAULT_BRANCH" \
            --head "$BRANCH" \
            --title "release(startos): prepare ${TAG}" \
            --body-file "$RUNNER_TEMP/startos-release-pr.md")"
          echo "url=${PR_URL}" >> "$GITHUB_OUTPUT"

      - name: Add preparation summary
        shell: bash
        env:
          OLD_VERSION: ${{ steps.version.outputs.old_version }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          TAG: ${{ steps.version.outputs.tag }}
          PR_URL: ${{ steps.pull_request.outputs.url }}
        run: |
          {
            echo "## StartOS release prepared"
            echo ""
            echo "- Version: \`${OLD_VERSION}\` → \`${NEW_VERSION}\`"
            echo "- Exact tag: \`${TAG}\`"
            echo "- Pull request: ${PR_URL}"
            echo ""
            echo "GitHub may show an **Approve workflows to run** button on the automated pull request. Approve it so the protected checks can start."
          } >> "$GITHUB_STEP_SUMMARY"
